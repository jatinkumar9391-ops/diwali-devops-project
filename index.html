<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali 2026</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <nav>
            <h2>🪔 Diwali Celebration</h2>
            <span>Festival of Lights</span>
        </nav>

        <main>
            <div class="diya">🪔</div>

            <h1>Happy Diwali 2026!</h1>

            <h2>Festival of Lights</h2>

            <p>
                May your life shine with happiness,
                prosperity and success.
            </p>

            <div class="wish-box">
                <input type="text" id="username"
                       placeholder="Enter your name">

                <button onclick="showWish()">
                    Send Diwali Wishes
                </button>
            </div>

            <h3 id="message"></h3>

            <button class="firework-btn" onclick="celebrate()">
                🎆 Celebrate Diwali
            </button>
        </main>

        <footer>
            <p>Made with ❤️ | Diwali 2026</p>
            <p>A Festival of Happiness & Light</p>
        </footer>
    </div>

    <div id="fireworks"></div>

    <script src="js/script.js"></script>
</body>
</html>
